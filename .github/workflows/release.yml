name: release · publish to npmjs + GitHub Packages

# One pipeline, two registries, same build. The `@dekimuhq` scope is public on
# npmjs and mirrored on GitHub Packages for consumers that read the scope there.
# scripts/release.mjs publishes the dist built by the `build` job to npmjs, then
# to GitHub Packages, and ends with scripts/registry-parity.mjs, which reds the
# run if the registries disagree on any version or its tarball integrity.
#
# Dispatch-only and main-only: a publish is not revertible. The full CI suite
# runs first on the same commit (`ci`), the build runs in a job that holds no
# secrets (`build`), and only `publish` — gated by the `release` environment,
# whose deployment branch policy allows main alone — can reach the secrets.
#
# Credentials (environment secrets on `release`, never repo-level, so a
# workflow on another branch cannot read them):
# - npmjs: Trusted Publishing (OIDC) — the id-token is exchanged for a one-shot
#   publish token, accepted only for packages whose npmjs settings name this
#   repo, `release.yml` and the `release` environment; provenance is attached.
#   A package's FIRST npmjs publish cannot use OIDC (trusted publishing needs
#   the package to exist), so it needs NPM_BOOTSTRAP_TOKEN (granular,
#   short-lived); delete that secret once trusted publishing is configured.
# - GitHub Packages: GH_PACKAGES_TOKEN, a classic PAT with write:packages. The
#   default GITHUB_TOKEN is refused (403 write_package) on the org's private
#   packages, which are not linked to this repo.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            packages/*/dist/**
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC → npm trusted-publishing token + provenance — nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"

      - name: npm supports trusted publishing?
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) < 11.5.1 cannot use trusted publishing"; exit 1; }

      # No package scripts run (ignore-scripts) and nothing is compiled here:
      # the dist below is the one the secretless build job produced.
      - run: npm ci --ignore-scripts
      # upload-artifact strips the paths' least common ancestor (`packages/`),
      # so the artifact holds `<name>/dist/**` and is restored under packages/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: packages
      # Every main/module/types/exports target of every package must exist.
      - name: dist restored for every package?
        run: node scripts/check-dist.mjs

      # Both legs' credentials are proven before anything is published, so a
      # dead GitHub token cannot strand a release on npmjs alone.
      - name: GitHub Packages credential works?
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          [ -n "$GH_PACKAGES_TOKEN" ] || { echo "::error::GH_PACKAGES_TOKEN is not set on the release environment"; exit 1; }
          # npm expands ${GH_PACKAGES_TOKEN} at read time; the value never lands on disk.
          # Leading newline: setup-node writes its .npmrc WITHOUT a trailing EOL, so a
          # bare append glues this line onto its last one and npm sees no auth (ENEEDAUTH).
          printf '\n%s\n' '//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}' >> "$NPM_CONFIG_USERCONFIG"
          npm whoami --registry=https://npm.pkg.github.com >/dev/null \
            || { echo "::error::GH_PACKAGES_TOKEN is rejected by npm.pkg.github.com"; exit 1; }
          # Least privilege, enforced: a classic PAT with `repo` reads and writes every
          # private repo its owner can reach, and it would sit in a public repo's
          # environment. write:packages (+ the read:packages it implies) is all npm needs.
          scopes=$(curl -fsS -o /dev/null -D - -H "Authorization: token $GH_PACKAGES_TOKEN" https://api.github.com/ \
            | tr -d '\r' | sed -n 's/^x-oauth-scopes: *//Ip')
          echo "GH_PACKAGES_TOKEN scopes: ${scopes:-<none>}"
          for s in ${scopes//,/ }; do
            case "$s" in write:packages|read:packages) ;;
              *) echo "::error::GH_PACKAGES_TOKEN carries scope '$s' — re-mint it with write:packages only"; exit 1 ;;
            esac
          done
          case ",${scopes// /}," in *,write:packages,*) ;; *) echo "::error::GH_PACKAGES_TOKEN lacks write:packages"; exit 1 ;; esac

      # A brand-new package cannot use trusted publishing for its first npmjs
      # version; fail here, before anything ships, with the bootstrap steps.
      - name: New packages have a bootstrap token?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/new-package-preflight.mjs

      - name: Publish (npmjs, then GitHub Packages) + registry parity
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          # Empty once trusted publishing is configured; npm then uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          RELEASE_SKIP_BUILD: '1'
          # npm reports why trusted publishing (OIDC) was skipped or refused only
          # at verbose level; without it a failed exchange surfaces as a bare
          # ENEEDAUTH (run 41099253660). npm redacts tokens in its logs.
          NPM_CONFIG_LOGLEVEL: verbose
        # No git tags are created: the release is identified by the commit and
        # the registries' versions (and the job keeps contents: read).
        run: npm run release -- --no-git-tag
